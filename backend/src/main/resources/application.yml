spring:
  application:
    name: flowpilot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowpilot}
    username: ${SPRING_DATASOURCE_USERNAME:flowpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:flowpilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@flowpilot.local}
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-jwt-flowpilot-viettel-digital-talent-2026}
    expiration-ms: 86400000 # 24 hours
  crypto:
    secret: ${APP_CRYPTO_SECRET:1234567890123456} # 16 bytes key
  bpmn:
    engine-url: ${BPMN_ENGINE_URL:http://localhost:8080/engine-rest}
  meeting-hold:
    duration-minutes: ${MEETING_HOLD_DURATION_MINUTES:15}
    expiration-scan-ms: ${MEETING_HOLD_EXPIRATION_SCAN_MS:60000}

resilience4j:
  retry:
    instances:
      bpmnEngine:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.net.ConnectException

server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
