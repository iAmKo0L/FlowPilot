services:
  postgres:
    image: postgres:15-alpine
    container_name: flowpilot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: flowpilot
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot -d flowpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  cibseven:
    image: camunda/camunda-bpm-platform:run-7.20.0
    container_name: flowpilot-engine
    ports:
      - "8080:8080"
    environment:
      - CAMUNDA_RUN_REST_BASIC_AUTH_ENABLED=false
      - CAMUNDA_BPM_RUN_EXAMPLE_ENABLED=false
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/engine-rest/version || wget -q -O- http://localhost:8080/engine-rest/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowpilot-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/flowpilot
      - SPRING_DATASOURCE_USERNAME=flowpilot
      - SPRING_DATASOURCE_PASSWORD=flowpilot
      - BPMN_ENGINE_URL=http://cibseven:8080/engine-rest
      - APP_CRYPTO_SECRET=1234567890123456
      - JWT_SECRET=please-change-this-secret-jwt-flowpilot-viettel-digital-talent-2026
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy
      cibseven:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowpilot-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8081
    depends_on:
      - backend

volumes:
  pgdata:
